<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave a Little Love</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #333333;
    }

    .guestbook {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #666;
      font-size: 15px;
    }

    .reactions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .reaction {
      border: 1px solid #ddd;
      background: white;
      border-radius: 14px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 25px;
      transition: transform 0.15s;
    }

    .reaction:hover {
      transform: scale(1.08);
    }

    .count {
      display: block;
      font-size: 13px;
      margin-top: 4px;
      color: #666;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: vertical;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    .send {
      margin-top: 10px;
      padding: 11px 25px;
      border: none;
      border-radius: 20px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .send:hover {
      opacity: 0.85;
    }

    .messages {
      margin-top: 30px;
      text-align: left;
    }

    .message {
      padding: 14px;
      margin-bottom: 10px;
      background: #f7f7f7;
      border-radius: 10px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .empty {
      text-align: center;
      color: #999;
      font-size: 14px;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #777;
      min-height: 18px;
    }
  </style>
</head>

<body>

  <div class="guestbook">

    <h1>💛 Leave a little love</h1>

    <div class="subtitle">
      Leave a reaction or a little message to celebrate this special journey.
    </div>

    <div class="reactions">

      <button class="reaction" onclick="addReaction('👏')">
        👏
        <span class="count" id="count-👏">0</span>
      </button>

      <button class="reaction" onclick="addReaction('❤️')">
        ❤️
        <span class="count" id="count-❤️">0</span>
      </button>

      <button class="reaction" onclick="addReaction('🎉')">
        🎉
        <span class="count" id="count-🎉">0</span>
      </button>

      <button class="reaction" onclick="addReaction('🍻')">
        🍻
        <span class="count" id="count-🍻">0</span>
      </button>

      <button class="reaction" onclick="addReaction('🥹')">
        🥹
        <span class="count" id="count-🥹">0</span>
      </button>

    </div>

    <textarea
      id="messageInput"
      placeholder="Leave a message..."
      maxlength="500"
    ></textarea>

    <br>

    <button class="send" onclick="sendMessage()">
      Send 💛
    </button>

    <div class="status" id="status"></div>

    <div class="messages">
      <h3>💌 Messages from Hoppies</h3>
      <div id="messageList">
        <div class="empty">Loading messages...</div>
      </div>
    </div>

  </div>


<script>

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL = "https://slxexovrytedtpzfsprh.supabase.co";

  const SUPABASE_KEY = "sb_publishable_5lvNTaDOBqjUdYO34Rzqbg_ZXgKd2gE";


  // ==========================================
  // HELPER
  // ==========================================

  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };


  // ==========================================
  // LOAD EVERYTHING
  // ==========================================

  async function loadGuestbook() {

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/guestbook?select=*&order=created_at.asc",
        {
          method: "GET",
          headers: headers
        }
      );

      if (!response.ok) {
        throw new Error("Unable to load guestbook");
      }

      const data = await response.json();

      updateReactionCounts(data);

      displayMessages(data);

    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "Unable to load the guestbook.";

    }

  }


  // ==========================================
  // REACTION COUNTS
  // ==========================================

  function updateReactionCounts(data) {

    const reactions = {
      "👏": 0,
      "❤️": 0,
      "🎉": 0,
      "🍻": 0,
      "🥹": 0
    };

    data.forEach(function(row) {

      if (row.type === "reaction" && reactions.hasOwnProperty(row.content)) {
        reactions[row.content]++;
      }

    });

    Object.keys(reactions).forEach(function(emoji) {

      const element = document.getElementById("count-" + emoji);

      if (element) {
        element.textContent = reactions[emoji];
      }

    });

  }


  // ==========================================
  // ADD REACTION
  // ==========================================

  async function addReaction(emoji) {

    try {

      document.getElementById("status").textContent =
        "Adding reaction...";

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/guestbook",
        {
          method: "POST",
          headers: {
            ...headers,
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({
            type: "reaction",
            content: emoji
          })
        }
      );

      if (!response.ok) {
        throw new Error("Reaction failed");
      }

      document.getElementById("status").textContent = "";

      loadGuestbook();

    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "Something went wrong. Please try again.";

    }

  }


  // ==========================================
  // SEND MESSAGE
  // ==========================================

  async function sendMessage() {

    const input = document.getElementById("messageInput");

    const message = input.value.trim();

    if (!message) {

      document.getElementById("status").textContent =
        "Please write a message first.";

      return;

    }


    try {

      document.getElementById("status").textContent =
        "Sending...";


      const response = await fetch(
        SUPABASE_URL + "/rest/v1/guestbook",
        {
          method: "POST",
          headers: {
            ...headers,
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({
            type: "message",
            content: message
          })
        }
      );


      if (!response.ok) {
        throw new Error("Message failed");
      }


      input.value = "";

      document.getElementById("status").textContent =
        "Message added 💛";


      loadGuestbook();


    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "Something went wrong. Please try again.";

    }

  }


  // ==========================================
  // DISPLAY MESSAGES
  // ==========================================

  function displayMessages(data) {

    const container = document.getElementById("messageList");

    const messages = data.filter(function(row) {
      return row.type === "message";
    });


    if (messages.length === 0) {

      container.innerHTML =
        '<div class="empty">Be the first to leave a little love 💛</div>';

      return;

    }


    container.innerHTML = "";


    messages.forEach(function(row) {

      const messageDiv = document.createElement("div");

      messageDiv.className = "message";

      messageDiv.textContent = row.content;

      container.appendChild(messageDiv);

    });

  }


  // ==========================================
  // START
  // ==========================================

  loadGuestbook();

</script>

</body>
</html>
