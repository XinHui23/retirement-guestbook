<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Leave a little love</title>

<style>

body {

  margin: 0;

  padding: 24px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #ffffff;

  color: #333;

  text-align: center;

}

.container {

  max-width: 600px;

  margin: auto;

}

h1 {

  margin-bottom: 8px;

  font-size: 28px;

}

.subtitle {

  margin-bottom: 24px;

  color: #666;

  font-size: 15px;

}

.reactions {

  display: flex;

  justify-content: center;

  gap: 12px;

  flex-wrap: wrap;

  margin-bottom: 10px;

}

.reaction {

  border: none;

  background: #f5f5f5;

  border-radius: 16px;

  padding: 14px 16px;

  font-size: 28px;

  cursor: pointer;

  transition: 0.2s;

}

.reaction:hover {

  transform: scale(1.08);

}

.reaction:disabled {

  transform: none;

}

.count {

  display: block;

  font-size: 13px;

  color: #777;

  margin-top: 4px;

}

textarea {

  width: 100%;

  box-sizing: border-box;

  min-height: 90px;

  padding: 12px;

  margin-top: 20px;

  border: 1px solid #ddd;

  border-radius: 12px;

  font-family: inherit;

  font-size: 15px;

  resize: vertical;

}

.send {

  margin-top: 10px;

  padding: 12px 24px;

  border: none;

  border-radius: 20px;

  background: #333;

  color: white;

  font-size: 15px;

  cursor: pointer;

}

.send:hover {

  opacity: 0.85;

}

#status {

  min-height: 20px;

  margin-top: 12px;

  font-size: 13px;

  color: #777;

}

.messages-title {

  margin-top: 30px;

  margin-bottom: 12px;

  font-size: 20px;

}

.message {

  background: #f8f8f8;

  padding: 12px 14px;

  margin: 8px 0;

  border-radius: 12px;

  text-align: left;

  word-wrap: break-word;

}

</style>

</head>


<body>

<div class="container">

  <h1>💛 Leave a little love</h1>

  <div class="subtitle">
    Leave a little love, a message, or a reaction.
  </div>


  <div class="reactions">

    <div>
      <button
        class="reaction"
        onclick="addReaction('👏')"
      >
        👏
      </button>

      <span
        class="count"
        id="count-👏"
      >
        0
      </span>
    </div>


    <div>
      <button
        class="reaction"
        onclick="addReaction('❤️')"
      >
        ❤️
      </button>

      <span
        class="count"
        id="count-❤️"
      >
        0
      </span>
    </div>


    <div>
      <button
        class="reaction"
        onclick="addReaction('🎉')"
      >
        🎉
      </button>

      <span
        class="count"
        id="count-🎉"
      >
        0
      </span>
    </div>


    <div>
      <button
        class="reaction"
        onclick="addReaction('🍻')"
      >
        🍻
      </button>

      <span
        class="count"
        id="count-🍻"
      >
        0
      </span>
    </div>


    <div>
      <button
        class="reaction"
        onclick="addReaction('🥹')"
      >
        🥹
      </button>

      <span
        class="count"
        id="count-🥹"
      >
        0
      </span>
    </div>

  </div>


  <textarea
    id="message"
    placeholder="Leave a message..."
  ></textarea>


  <button
    class="send"
    onclick="sendMessage()"
  >
    Send 💛
  </button>


  <div id="status"></div>


  <div class="messages-title">
    💌 Messages from Hoppies
  </div>


  <div id="messages"></div>

</div>


<script>


// ==========================================
// SUPABASE SETTINGS
// ==========================================

const SUPABASE_URL =
  "https://slxexovrytedtpzfsprh.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_5lvNTaDOBqjUdYO34Rzqbg_ZXgKd2gE";


// ==========================================
// GUESTBOOK ID
// ==========================================

const urlParams =
  new URLSearchParams(window.location.search);


let GUESTBOOK_ID =
  urlParams.get("id");


if (!GUESTBOOK_ID) {

  GUESTBOOK_ID = "test";

}


// ==========================================
// SUPABASE HEADERS
// ==========================================

const headers = {

  "apikey": SUPABASE_KEY,

  "Authorization":
    "Bearer " + SUPABASE_KEY,

  "Content-Type":
    "application/json"

};


// ==========================================
// LOAD GUESTBOOK
// ==========================================

async function loadGuestbook() {

  try {

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/guestbook" +
      "?guestbook_id=eq." +
      encodeURIComponent(GUESTBOOK_ID) +
      "&order=created_at.asc",

      {

        method: "GET",

        headers: headers

      }

    );


    if (!response.ok) {

      throw new Error(
        "Could not load guestbook"
      );

    }


    const data =
      await response.json();


    // Reset reaction counts

    const emojis = [
      "👏",
      "❤️",
      "🎉",
      "🍻",
      "🥹"
    ];


    emojis.forEach(function(emoji) {

      const count =
        data.filter(function(item) {

          return (
            item.type === "reaction" &&
            item.content === emoji
          );

        }).length;


      document.getElementById(
        "count-" + emoji
      ).textContent = count;

    });


    // Show messages

    const messages =
      data.filter(function(item) {

        return item.type === "message";

      });


    const messagesContainer =
      document.getElementById("messages");


    messagesContainer.innerHTML = "";


    messages.forEach(function(item) {

      const message =
        document.createElement("div");


      message.className = "message";


      message.textContent =
        item.content;


      messagesContainer.appendChild(
        message
      );

    });


  } catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Unable to load guestbook.";

  }

}


// ==========================================
// ADD REACTION
// ==========================================

async function addReaction(emoji) {

  const reactionKey =
    "reaction_" + GUESTBOOK_ID;


  // Check whether this browser
  // has already reacted

  if (
    localStorage.getItem(reactionKey)
  ) {

    document.getElementById(
      "status"
    ).textContent =
      "You've already left a reaction 💛";

    return;

  }


  try {

    document.getElementById(
      "status"
    ).textContent =
      "Adding reaction...";


    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/guestbook",

      {

        method: "POST",

        headers: {

          ...headers,

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({

          type: "reaction",

          content: emoji,

          guestbook_id:
            GUESTBOOK_ID

        })

      }

    );


    if (!response.ok) {

      throw new Error(
        "Reaction failed"
      );

    }


    // Remember this browser's reaction

    localStorage.setItem(
      reactionKey,
      emoji
    );


    document.getElementById(
      "status"
    ).textContent =
      "Thanks for the love! 💛";


    disableReactionButtons();


    loadGuestbook();


  } catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Something went wrong. Please try again.";

  }

}


// ==========================================
// SEND MESSAGE
// ==========================================

async function sendMessage() {

  const messageInput =
    document.getElementById("message");


  const message =
    messageInput.value.trim();


  if (!message) {

    document.getElementById(
      "status"
    ).textContent =
      "Please write a message first.";

    return;

  }


  try {

    document.getElementById(
      "status"
    ).textContent =
      "Sending...";


    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/guestbook",

      {

        method: "POST",

        headers: {

          ...headers,

          "Prefer":
            "return=minimal"

        },

        body: JSON.stringify({

          type: "message",

          content: message,

          guestbook_id:
            GUESTBOOK_ID

        })

      }

    );


    if (!response.ok) {

      throw new Error(
        "Message failed"
      );

    }


    messageInput.value = "";


    document.getElementById(
      "status"
    ).textContent =
      "Message sent 💛";


    loadGuestbook();


  } catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Something went wrong. Please try again.";

  }

}


// ==========================================
// DISABLE REACTION BUTTONS
// ==========================================

function disableReactionButtons() {

  const buttons =
    document.querySelectorAll(
      ".reaction"
    );


  buttons.forEach(function(button) {

    button.disabled = true;

    button.style.opacity = "0.5";

    button.style.cursor = "default";

  });

}


// ==========================================
// CHECK EXISTING REACTION
// ==========================================

const existingReaction =
  localStorage.getItem(
    "reaction_" + GUESTBOOK_ID
  );


if (existingReaction) {

  disableReactionButtons();

}


// ==========================================
// START
// ==========================================

loadGuestbook();

</script>

</body>

</html>
