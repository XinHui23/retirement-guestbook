<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<style>

html,
body {

  margin: 0;

  padding: 0;

  width: 100%;

  height: 100%;

  background: transparent;

  overflow: hidden;

  font-family: Arial, Helvetica, sans-serif;

}


/* =================================
   SMALL WELCOME BUTTON
   ================================= */

.welcome-button {

  position: absolute;

  right: 18px;

  bottom: 18px;

  border: none;

  background: white;

  border-radius: 20px;

  padding: 6px 11px;

  font-size: 11px;

  font-weight: bold;

  color: #333;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,0.15);

  cursor: pointer;

  white-space: nowrap;

  z-index: 1000;

  transition: 0.2s;

}


.welcome-button:hover {

  transform: scale(1.05);

}


/* =================================
   CELEBRATION EMOJIS
   ================================= */

.celebration {

  position: absolute;

  bottom: -40px;

  font-size: 26px;

  pointer-events: none;

  z-index: 900;

  animation:
    floatUp 3s ease-out forwards;

}


@keyframes floatUp {

  0% {

    transform:
      translateY(0)
      rotate(0deg)
      scale(0.7);

    opacity: 1;

  }


  50% {

    opacity: 1;

  }


  100% {

    transform:
      translateY(-110vh)
      rotate(360deg)
      scale(1.15);

    opacity: 0;

  }

}

</style>

</head>


<body>


<button
  class="welcome-button"
  onclick="welcome()"
>

  🎉 Welcome!

</button>


<script>


function welcome() {


  const emojis = [

    "🎈",
    "🎉",
    "✨",
    "💛",
    "🥳",
    "🎊"

  ];


  for (
    let i = 0;
    i < 20;
    i++
  ) {


    const emoji =
      document.createElement("div");


    emoji.className =
      "celebration";


    emoji.textContent =
      emojis[
        Math.floor(
          Math.random() *
          emojis.length
        )
      ];


    // Spread emojis across
    // the whole page

    emoji.style.left =
      Math.random() * 100 + "%";


    // Slightly different
    // starting positions

    emoji.style.bottom =
      (-20 + Math.random() * 30) + "px";


    // Different animation speeds

    emoji.style.animationDuration =
      (2.5 + Math.random() * 2) + "s";


    document.body.appendChild(
      emoji
    );


    setTimeout(function() {

      emoji.remove();

    }, 5000);

  }

}

</script>


</body>

</html>
