<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Welcome to Carlsberg</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fff8e8,
      #ffffff,
      #fff1c9
    );

  color: #333;

  overflow-x: hidden;

}

.container {

  max-width: 700px;

  margin: auto;

  padding: 40px 24px 60px;

  text-align: center;

}

.welcome {

  font-size: 16px;

  letter-spacing: 2px;

  margin-bottom: 10px;

  color: #777;

}

h1 {

  font-size: 42px;

  margin: 0 0 14px;

}

.subtitle {

  font-size: 18px;

  line-height: 1.5;

  color: #666;

  margin-bottom: 35px;

}

.celebrate {

  border: none;

  border-radius: 30px;

  padding: 15px 28px;

  font-size: 17px;

  background: #333;

  color: white;

  cursor: pointer;

  transition: 0.2s;

}

.celebrate:hover {

  transform: scale(1.05);

}

.card {

  background: white;

  border-radius: 20px;

  padding: 25px;

  margin-top: 30px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,0.08);

}

.card h2 {

  margin-top: 0;

}

.vibes {

  display: flex;

  justify-content: center;

  gap: 12px;

  flex-wrap: wrap;

  margin-top: 20px;

}

.vibe {

  border: none;

  background: #f5f5f5;

  border-radius: 16px;

  padding: 15px 18px;

  font-size: 28px;

  cursor: pointer;

  transition: 0.2s;

}

.vibe:hover {

  transform: scale(1.12);

}

#message {

  margin-top: 18px;

  min-height: 30px;

  font-size: 15px;

  color: #666;

}

.balloon {

  position: fixed;

  bottom: -100px;

  font-size: 45px;

  animation:
    floatUp 4s linear forwards;

  pointer-events: none;

}

@keyframes floatUp {

  0% {

    transform:
      translateY(0)
      rotate(0deg);

    opacity: 1;

  }

  100% {

    transform:
      translateY(-120vh)
      rotate(20deg);

    opacity: 0;

  }

}

.confetti {

  position: fixed;

  top: -20px;

  font-size: 25px;

  animation:
    fall 3s linear forwards;

  pointer-events: none;

}

@keyframes fall {

  0% {

    transform:
      translateY(0)
      rotate(0deg);

    opacity: 1;

  }

  100% {

    transform:
      translateY(110vh)
      rotate(360deg);

    opacity: 0;

  }

}

</style>

</head>


<body>


<div class="container">

  <div class="welcome">
    A BIG HELLO TO OUR NEW HOPPIE
  </div>


  <h1>
    👋 Welcome to Carlsberg!
  </h1>


  <div class="subtitle">

    A new journey begins here.
    <br>

    We're happy to have you with us! 💛

  </div>


  <button
    class="celebrate"
    onclick="celebrate()"
  >

    🎉 Let's Celebrate!

  </button>


  <div class="card">

    <h2>
      🌟 Send a little welcome
    </h2>


    <div>

      How would you welcome
      our new Hoppie?

    </div>


    <div class="vibes">

      <button
        class="vibe"
        onclick="chooseVibe('👋')"
      >
        👋
      </button>


      <button
        class="vibe"
        onclick="chooseVibe('💛')"
      >
        💛
      </button>


      <button
        class="vibe"
        onclick="chooseVibe('🎉')"
      >
        🎉
      </button>


      <button
        class="vibe"
        onclick="chooseVibe('🍻')"
      >
        🍻
      </button>


      <button
        class="vibe"
        onclick="chooseVibe('🚀')"
      >
        🚀
      </button>

    </div>


    <div id="message"></div>

  </div>


</div>


<script>


function chooseVibe(emoji) {

  document.getElementById(
    "message"
  ).textContent =
    "Welcome from a fellow Hoppie! " +
    emoji;

}


function celebrate() {

  // Create balloons

  const balloons = [
    "🎈",
    "🎈",
    "🎈",
    "🎈",
    "🎈"
  ];


  balloons.forEach(function(balloon) {

    const element =
      document.createElement("div");


    element.className =
      "balloon";


    element.textContent =
      balloon;


    element.style.left =
      Math.random() * 100 + "%";


    element.style.animationDuration =
      (3 + Math.random() * 2) + "s";


    document.body.appendChild(
      element
    );


    setTimeout(function() {

      element.remove();

    }, 5000);

  });


  // Create confetti

  const confetti = [
    "🎉",
    "✨",
    "💛",
    "🎊",
    "⭐",
    "🥳"
  ];


  for (
    let i = 0;
    i < 25;
    i++
  ) {

    const element =
      document.createElement("div");


    element.className =
      "confetti";


    element.textContent =
      confetti[
        Math.floor(
          Math.random() *
          confetti.length
        )
      ];


    element.style.left =
      Math.random() * 100 + "%";


    element.style.animationDuration =
      (2 + Math.random() * 2) + "s";


    document.body.appendChild(
      element
    );


    setTimeout(function() {

      element.remove();

    }, 4500);

  }

}

</script>


</body>

</html>
