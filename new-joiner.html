<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<style>

html,
body {

  margin: 0;

  padding: 0;

  width: 100%;

  height: 100%;

  background: transparent;

  overflow: hidden;

  font-family: Arial, Helvetica, sans-serif;

}


/* ============================
   SMALL WELCOME BUTTON
   ============================ */

.welcome-button {

  position: absolute;

  right: 8px;

  bottom: 8px;

  border: none;

  background: white;

  border-radius: 20px;

  padding: 5px 10px;

  font-size: 11px;

  font-weight: bold;

  color: #333;

  box-shadow:
    0 2px 7px
    rgba(0,0,0,0.15);

  cursor: pointer;

  white-space: nowrap;

  transition: 0.2s;

}


.welcome-button:hover {

  transform: scale(1.05);

}


/* ============================
   FLOATING EMOJIS
   ============================ */

.celebration {

  position: absolute;

  right: 20px;

  bottom: 25px;

  font-size: 20px;

  pointer-events: none;

  animation:
    floatUp 2s ease-out forwards;

}


@keyframes floatUp {

  0% {

    transform:
      translate(0, 0)
      scale(0.7);

    opacity: 1;

  }

  100% {

    transform:
      translate(
        calc(-60px + 120px * var(--random-x)),
        -130px
      )
      scale(1.1);

    opacity: 0;

  }

}

</style>

</head>


<body>


<button
  class="welcome-button"
  onclick="welcome()"
>

  🎉 Welcome!

</button>


<script>


function welcome() {


  const emojis = [

    "🎈",
    "🎉",
    "✨",
    "💛",
    "🥳"

  ];


  for (
    let i = 0;
    i < 10;
    i++
  ) {


    const emoji =
      document.createElement("div");


    emoji.className =
      "celebration";


    emoji.textContent =
      emojis[
        Math.floor(
          Math.random() *
          emojis.length
        )
      ];


    emoji.style.setProperty(
      "--random-x",
      Math.random()
    );


    document.body.appendChild(
      emoji
    );


    setTimeout(function() {

      emoji.remove();

    }, 2200);

  }

}

</script>


</body>

</html>
